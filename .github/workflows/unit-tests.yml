name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Quality gate, Java unit tests, and the agents JS suite used to be three
  # separate jobs (= three concurrently-requested runners per PR push, all
  # competing for the org's shared runner pool). They're merged into one job
  # on one runner, run sequentially. This job's `name:` stays "Java unit
  # tests" because that literal string is the required status check in the
  # "Protect main" branch ruleset — do not rename it without also updating
  # the ruleset.
  #
  # Quality-gate steps keep `continue-on-error: true` so a failure there is
  # visible (annotated, non-zero step, workflow summary) but does NOT fail
  # this job / block merge. The agents JS suite is a REAL gate (dm.ai#635):
  # green always, red blocks — it has no continue-on-error and its run step
  # propagates the runner's exit code.
  test:
    name: Java unit tests
    # GitHub-hosted runner (owner decision 2026-10-08). The Bitrise Build Hub pool
    # "dmtools-ci" (label "bitrise-runner-dmtools-ci") stopped picking up jobs: queued runs sat
    # for 3+ hours with no runner assigned, which blocked every PR on this required check.
    # To go back to Bitrise, set the label back once the pool is healthy.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js (for jscpd)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install jscpd
        run: npm install -g jscpd@5.0.11

      - name: 'Quality gate: check Java file sizes'
        id: quality_gate_file_sizes
        continue-on-error: true
        run: |
          MAX_LINES=2800
          FAILED=0
          while IFS= read -r file; do
            case "$file" in
              *.java)
                # Only fail if the file is currently over the limit AND was not
                # already over the limit on the base branch. This lets legacy
                # large files improve gradually while preventing new violations.
                head_lines=$(wc -l < "$file")
                base_lines=$(git show origin/${{ github.base_ref }}:"$file" 2>/dev/null | wc -l || echo 0)
                if (( head_lines > MAX_LINES && base_lines <= MAX_LINES )); then
                  echo "❌ $file: $head_lines lines (max $MAX_LINES); was $base_lines on ${{ github.base_ref }}"
                  FAILED=1
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD)
          if [ "$FAILED" -ne 0 ]; then
            echo "Quality gate failed: changed Java files exceed $MAX_LINES lines."
            exit 1
          fi

      - name: 'Quality gate: check code duplication against baseline'
        id: quality_gate_duplication
        continue-on-error: true
        run: |
          jscpd --min-tokens 50 --min-lines 5 --reporters json --output /tmp/jscpd-check dmtools-core/src/main/java/ >/dev/null 2>&1 || true
          CURRENT=$(python3 -c '
          import json,sys
          try:
              with open("/tmp/jscpd-check/jscpd-report.json") as f:
                  d=json.load(f)
              print(d["statistics"]["total"]["percentage"])
          except: print("0.0")
          ')
          BASELINE=$(python3 -c '
          import json,sys
          try:
              with open("scripts/jscpd-baseline.json") as f:
                  d=json.load(f)
              print(d.get("percentage", 999.0))
          except: print("999.0")
          ')
          echo "Current duplication: $CURRENT%"
          echo "Baseline: $BASELINE%"
          python3 -c "import sys; sys.exit(0 if float('$CURRENT') <= float('$BASELINE') else 1)"

      - name: 'Quality gate: jsr prelude sync (vendored node_compat JS == IstiN/quickjs_runtime@JSR_PRELUDES_PIN)'
        run: dmtools-core/tool/check_jsr_prelude_sync.sh

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Git for tests
        run: |
          git config --global user.name "dm.ai"
          git config --global user.email "dm.ai@epam.com"

      - name: Run unit tests
        run: ./gradlew :dmtools-core:test --no-daemon -x integrationTest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        continue-on-error: true
        with:
          name: Unit Test Results
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Build DMTools shadow JAR (for agents JS tests)
        run: ./gradlew :dmtools-core:shadowJar --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install DMTools CLI for agents tests
        run: |
          mkdir -p "$HOME/.dmtools"
          cp "build/libs/dmtools-v$(grep '^version=' gradle.properties | cut -d'=' -f2)-all.jar" "$HOME/.dmtools/dmtools.jar"
          echo "Installed DMTools CLI:"
          java -jar "$HOME/.dmtools/dmtools.jar" --version

      - name: 'Agents JS tests: run'
        id: agents_tests
        env:
          JAVA_TOOL_OPTIONS: '-Xmx6g'
        run: |
          cd agents
          set +e
          TOTAL_SHARDS=4
          : > ../agents-test-output.json
          for SHARD in $(seq 0 $((TOTAL_SHARDS - 1))); do
            SHARD_CFG="/tmp/agents_run_shard_${SHARD}.json"
            node -e "
              const cfg = JSON.parse(require('fs').readFileSync('js/unit-tests/run_all.json', 'utf8'));
              const all = cfg.params.jobParams.testFiles;
              const files = ${SHARD} === 0
                ? ['js/unit-tests/test_smAgent.js']
                : all.filter(f => f !== 'js/unit-tests/test_smAgent.js').filter((_, i) => i % (${TOTAL_SHARDS} - 1) === (${SHARD} - 1));
              cfg.params.jobParams.testFiles = files;
              require('fs').writeFileSync('${SHARD_CFG}', JSON.stringify(cfg, null, 2));
              console.log('Shard ${SHARD}/${TOTAL_SHARDS}: ' + files.length + ' files');
            "
            ../dmtools.sh run "$SHARD_CFG" > "/tmp/agents-test-output-${SHARD}.json" 2>&1
            RC=$?
            cat "/tmp/agents-test-output-${SHARD}.json" | tee -a ../agents-test-output.json
            if [ "$RC" -ne 0 ]; then
              echo "::error::dmtools run shard $SHARD exited with $RC"
              exit "$RC"
            fi
          done

      - name: 'Agents JS tests: validate results'
        id: agents_tests_validate
        run: |
          PASSED_LIST=$(grep -oE '"passed"[[:space:]]*:[[:space:]]*[0-9]+' agents-test-output.json | grep -oE '[0-9]+' || true)
          FAILED_LIST=$(grep -oE '"failed"[[:space:]]*:[[:space:]]*[0-9]+' agents-test-output.json | grep -oE '[0-9]+' || true)
          SHARDS_REPORTED=$(printf '%s\n' "$PASSED_LIST" | grep -cE '^[0-9]+$' || true)
          PASSED=$(printf '%s\n' "$PASSED_LIST" | awk '{s+=$1} END{print s+0}')
          FAILED=$(printf '%s\n' "$FAILED_LIST" | awk '{s+=$1} END{print s+0}')
          echo "Agents JS tests ($SHARDS_REPORTED shards): $PASSED passed, $FAILED failed"
          if [ "$SHARDS_REPORTED" -lt 4 ] || [ "$PASSED" -eq 0 ]; then
            echo "Could not parse agents test results (expected 4 shards, got $SHARDS_REPORTED)"
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "Some agents JS tests failed. See output above for details."
            exit 1
          fi

      - name: Summary of advisory (non-blocking) checks
        if: always()
        run: |
          fail=0
          check() {
            local label="$1" outcome="$2"
            if [ "$outcome" = "failure" ]; then
              echo "❌ $label: FAILED (advisory — did not block this required check)" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            else
              echo "✅ $label: passed" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          check "Quality gate: file sizes" "${{ steps.quality_gate_file_sizes.outcome }}"
          check "Quality gate: duplication" "${{ steps.quality_gate_duplication.outcome }}"
          if [ "$fail" -ne 0 ]; then
            echo "::warning::One or more advisory checks failed — see step summary for details."
          fi
