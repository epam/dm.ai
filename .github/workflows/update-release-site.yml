name: Update Release Site Data

# Updates the public cli-manifest.json and the landing /releases pages when a
# CLI release is published. The install scripts read the manifest from Pages to
# avoid GitHub API rate limits during version detection.
#
# The workflow commits updated files to main; the existing deploy-landing.yml
# workflow then deploys the site automatically.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., v1.7.200)'
        required: true
      release_notes_file:
        description: 'Path to release notes markdown file'
        required: false
        default: 'release_notes.md'
      checksums_file:
        description: 'Path to CLI checksums file'
        required: false
        default: 'dmtools-checksums.sha256'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-site-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine release inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.inputs.outputs.version }}"
          mkdir -p release-site-tmp
          if [ "${{ github.event_name }}" = "release" ]; then
            python3 -c "import os; open('release-site-tmp/release_notes.md','w',encoding='utf-8').write(os.environ.get('RELEASE_BODY') or '')"
          elif [ -n "${{ inputs.release_notes_file }}" ] && [ -f "${{ inputs.release_notes_file }}" ]; then
            cp "${{ inputs.release_notes_file }}" release-site-tmp/release_notes.md
          else
            # Fall back to fetching the release body via the API so a manual
            # workflow_dispatch (e.g. triggered right after `gh release create`)
            # doesn't need any local files checked out.
            gh release view "$VERSION" --repo "${{ github.repository }}" --json body -q .body > release-site-tmp/release_notes.md
          fi

      - name: Download checksums asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.inputs.outputs.version }}"
          mkdir -p release-site-tmp
          if [ -n "${{ inputs.checksums_file }}" ] && [ -f "${{ inputs.checksums_file }}" ]; then
            cp "${{ inputs.checksums_file }}" release-site-tmp/dmtools-checksums.sha256
          else
            gh release download "$VERSION" \
              --repo "${{ github.repository }}" \
              --pattern "dmtools-checksums.sha256" \
              --dir release-site-tmp \
              --clobber
          fi

      - name: Generate site data
        run: |
          python3 .github/scripts/generate-release-site-data.py \
            --version "${{ steps.inputs.outputs.version }}" \
            --release-notes "release-site-tmp/release_notes.md" \
            --checksums "release-site-tmp/dmtools-checksums.sha256" \
            --site-url "https://dmtools.lab.epam.com"

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add landing/public/cli-manifest.json landing/src/data/releases.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          VERSION="${{ steps.inputs.outputs.version }}"
          git commit -m "chore(release): update site data for ${VERSION}"
          # Push to a transient branch and open a PR so the change goes through
          # the required status checks on main instead of bypassing them.
          BRANCH="chore/release-site-data-${VERSION}"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(release): update site data for ${VERSION}" \
            --body "Automated release site data update for ${VERSION}." \
            --base main \
            --head "$BRANCH" \
            --repo "${{ github.repository }}" || true
          # Enable auto-merge so this data-only PR lands as soon as the
          # required "Java unit tests" check passes, without manual action.
          gh pr merge "$BRANCH" \
            --squash \
            --auto \
            --repo "${{ github.repository }}" || true
