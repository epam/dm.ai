name: Deploy Landing Page to GitHub Pages

# Only the default branch deploys. The github-pages environment restricts
# deployments to it, so triggering on any other branch produces a run that is
# rejected by the environment protection rule rather than a useful preview.
# Use workflow_dispatch to publish on demand from the default branch.
on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build landing page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # landing/index.html is assembled from template.html and sections/, and
      # committed so the site still needs no build to serve. That leaves one
      # failure mode worth guarding: a section edited without rebuilding.
      - name: Verify index.html matches its sources
        run: python3 landing/build.py --check

      # GA_MEASUREMENT_ID is a repository variable (Settings -> Variables -> Actions),
      # not a secret: a GA4 measurement ID is public as soon as the page is served.
      # When it is absent the whole snippet is removed instead of being left
      # half-written, which would break the document.
      - name: Inject Google Analytics measurement ID
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          PAGE=landing/index.html

          if [ -n "${GA_MEASUREMENT_ID}" ]; then
            sed -i "s/__GA_MEASUREMENT_ID__/${GA_MEASUREMENT_ID}/g" "$PAGE"
            echo "Google Analytics enabled: ${GA_MEASUREMENT_ID}"
          else
            sed -i '/<!-- ga:start/,/<!-- ga:end -->/d' "$PAGE"
            echo "GA_MEASUREMENT_ID not set - analytics snippet removed"
          fi

          if grep -q '__GA_MEASUREMENT_ID__' "$PAGE"; then
            echo "::error::GA placeholder still present after processing"
            exit 1
          fi

      # Must run before the substitution below: it is what reports the address
      # this repository actually publishes to.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # canonical, og:image, the sitemap and three schema fields all need an
      # absolute URL, and the right one differs per repository — a fork serves
      # from its own github.io path. Taking it from configure-pages means nobody
      # has to remember to edit a hardcoded domain after forking.
      - name: Substitute the published site URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          FILES="landing/index.html landing/sitemap.xml landing/robots.txt"

          if [ -z "${SITE_URL}" ]; then
            echo "::error::configure-pages reported no base_url"
            exit 1
          fi

          # base_url carries no trailing slash; the placeholder is always
          # followed by an explicit one in the sources.
          SITE_URL="${SITE_URL%/}"
          sed -i "s|__SITE_URL__|${SITE_URL}|g" $FILES
          echo "Site URL: ${SITE_URL}"

          if grep -l '__SITE_URL__' $FILES; then
            echo "::error::a __SITE_URL__ placeholder survived substitution"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
