# Bitrise CI configuration — PR checks migrated from GitHub Actions.
#
# This file replicates the repository's GitHub PR checks and PR automations:
#   - "Java unit tests"   (required status check, was .github/workflows/unit-tests.yml)
#   - auto-update-prs, dependabot-auto-merge, deploy-landing-on-site-data-merge
#     (PR automations, were .github/workflows/*.yml)
#
# The OWASP dependency check was removed: NVD_API_KEY resolves to an empty value
# at runtime, so every run failed the live NVD update and scanned a stale cached
# snapshot. It provided no real value and was dropped from both GitHub Actions
# and Bitrise.
#
# Location: this config is stored at .bitrise/bitrise.yml (a custom path).
# In the Bitrise app settings set "Config source" = repository, custom path
# ".bitrise/bitrise.yml", so Bitrise reads it from the repo.
#
# Status reports use the exact GitHub check contexts ("Java unit tests",
# "OWASP dependency check (advisory)") so the existing branch ruleset keeps
# matching without changes.

format_version: "25"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: java

title: DM Tools — PR checks
summary: Java unit tests, quality gates, agents JS suite, OWASP dependency check
description: >-
  Bitrise port of the GitHub PR checks. The "Java unit tests" pipeline is the
  required check; the OWASP dependency check stays advisory (never blocks).

# Default stack: Ubuntu with Java 17 + Node available (Android stack carries both).
meta:
  bitrise.io:
    stack: linux-docker-android-22.04
    machine_type_id: g2.linux.2medium

app:
  envs:
    # Tests read GITHUB_TOKEN (used by GitHub-integration unit tests).
    - GITHUB_TOKEN: $GITHUB_TOKEN
    - GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    - DMTOOLS_CACHE_ENABLED: "false"

pipelines:
  # Required PR check — mirrors the "Java unit tests" GitHub status check.
  pr-unit-tests:
    title: Java unit tests
    status_report_name: Java unit tests
    triggers:
      pull_request:
        - target_branch: "*"
    workflows:
      unit-tests: {}

  # ----------------------------------------------------------------------
  # Automations (were PR-triggered GitHub workflows; not status checks).
  # ----------------------------------------------------------------------

  # Was .github/workflows/auto-update-prs.yml — keeps open PRs up to date with
  # main. Push to main / schedule updates ALL open PRs; a PR event updates just
  # the triggering PR. (The 15-min cron fallback is configured in the Bitrise
  # app: Scheduled builds -> every 15 min -> this pipeline.)
  auto-update-open-prs:
    title: Auto-update open PRs
    status_report_name: auto-update-prs
    triggers:
      push:
        - branch: main
      pull_request:
        - source_branch: "*"
          target_branch: main
          draft_enabled: false
    workflows:
      auto-update-prs: {}

  # Was .github/workflows/dependabot-auto-merge.yml — enables auto-merge
  # (squash) on non-draft dependabot PRs targeting main.
  dependabot-auto-merge:
    title: Dependabot auto-merge
    status_report_name: dependabot-auto-merge
    triggers:
      pull_request:
        - source_branch:
            regex: '^dependabot/.*'
          target_branch: main
          draft_enabled: false
    workflows:
      dependabot-auto-merge: {}

  # Was .github/workflows/deploy-landing-on-site-data-merge.yml — after a
  # "chore(release): update site data for ..." squash-merge lands on main,
  # re-trigger the landing deploy (bot merges don't fire GitHub push triggers).
  deploy-landing-on-site-data-merge:
    title: Deploy Landing After Site Data Merge
    status_report_name: deploy-landing-on-site-data-merge
    triggers:
      push:
        - branch: main
          commit_message:
            regex: 'chore\(release\): update site data for'
    workflows:
      trigger-landing-deploy: {}

workflows:

  # ------------------------------------------------------------------------
  # Java unit tests + quality gates + agents JS suite (required check).
  # ------------------------------------------------------------------------
  unit-tests:
    title: Java unit tests
    summary: Quality gates, dmtools-core unit tests, and the agents JS suite
    steps:
      - git-clone@8:
          inputs:
            # Full history + submodules: the file-size gate diffs against the
            # PR base branch and the agents/ submodule holds the JS test suite.
            # clone_depth -1 disables the depth limit (full clone).
            - clone_depth: '-1'
            - update_submodules: 'yes'

      - cache-pull@2:
          inputs:
            - cache_key: gradle-{{ checksum "gradle.properties" }}

      - script@1:
          title: Set up Node.js + jscpd
          is_skippable: true
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                node --version
                npm install -g jscpd@5.0.11

      - script@1:
          title: 'Quality gate: check Java file sizes (advisory)'
          is_skippable: true
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                BASE_REF="${BITRISEIO_PULL_REQUEST_DEST_BRANCH:-main}"
                git fetch origin "$BASE_REF" --depth=1 >/dev/null 2>&1 || true
                MAX_LINES=2800
                FAILED=0
                while IFS= read -r file; do
                  case "$file" in
                    *.java)
                      head_lines=$(wc -l < "$file")
                      base_lines=$(git show origin/"$BASE_REF":"$file" 2>/dev/null | wc -l || echo 0)
                      if (( head_lines > MAX_LINES && base_lines <= MAX_LINES )); then
                        echo "❌ $file: $head_lines lines (max $MAX_LINES); was $base_lines on $BASE_REF"
                        FAILED=1
                      fi
                      ;;
                  esac
                done < <(git diff --name-only --diff-filter=ACMR origin/"$BASE_REF"...HEAD)
                if [ "$FAILED" -ne 0 ]; then
                  echo "Quality gate failed: changed Java files exceed $MAX_LINES lines."
                  exit 1
                fi

      - script@1:
          title: 'Quality gate: code duplication vs baseline (advisory)'
          is_skippable: true
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                jscpd --min-tokens 50 --min-lines 5 --reporters json --output /tmp/jscpd-check dmtools-core/src/main/java/ >/dev/null 2>&1 || true
                CURRENT=$(python3 -c '
                import json
                try:
                    with open("/tmp/jscpd-check/jscpd-report.json") as f:
                        d=json.load(f)
                    print(d["statistics"]["total"]["percentage"])
                except Exception:
                    print("0.0")
                ')
                BASELINE=$(python3 -c '
                import json
                try:
                    with open("scripts/jscpd-baseline.json") as f:
                        d=json.load(f)
                    print(d.get("percentage", 999.0))
                except Exception:
                    print("999.0")
                ')
                echo "Current duplication: $CURRENT%"
                echo "Baseline: $BASELINE%"
                python3 -c "import sys; sys.exit(0 if float('$CURRENT') <= float('$BASELINE') else 1)"

      - script@1:
          title: Set up Java 17 + configure git
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                # The stack ships Java 17; expose it explicitly and fail loudly otherwise.
                if ! java -version 2>&1 | grep -q '17'; then
                  echo "Java 17 is required but not on PATH" >&2
                  exit 1
                fi
                java -version
                git config --global user.name "dm.ai"
                git config --global user.email "dm.ai@epam.com"

      - script@1:
          title: Run unit tests (dmtools-core)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                ./gradlew :dmtools-core:test --no-daemon -x integrationTest

      - script@1:
          title: Build DMTools shadow JAR (for agents JS tests)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                ./gradlew :dmtools-core:shadowJar --no-daemon
                mkdir -p "$HOME/.dmtools"
                cp "build/libs/dmtools-v$(grep '^version=' gradle.properties | cut -d'=' -f2)-all.jar" "$HOME/.dmtools/dmtools.jar"
                java -jar "$HOME/.dmtools/dmtools.jar" --version

      - script@1:
          title: 'Agents JS tests: run + validate (advisory)'
          is_skippable: true
          inputs:
            - content: |-
                #!/usr/bin/env bash
                cd agents
                ../dmtools.sh run js/unit-tests/run_all.json > ../agents-test-output.json 2>&1 || true
                cat ../agents-test-output.json
                cd ..
                PASSED=$(grep -oE '"passed"\s*:\s*[0-9]+' agents-test-output.json | tail -1 | grep -oE '[0-9]+')
                FAILED=$(grep -oE '"failed"\s*:\s*[0-9]+' agents-test-output.json | tail -1 | grep -oE '[0-9]+')
                echo "Agents JS tests: $PASSED passed, $FAILED failed"
                if [ -z "$PASSED" ] || [ -z "$FAILED" ]; then
                  echo "Could not parse agents test results"
                  exit 1
                fi
                if [ "$FAILED" -ne 0 ]; then
                  echo "Some agents JS tests failed. See output above for details."
                  exit 1
                fi

      - deploy-to-bitrise-io@2:
          title: Publish test results + agents output
          is_always_run: true
          is_skippable: true
          inputs:
            - path: |
                **/build/test-results/test/TEST-*.xml
                agents-test-output.json

      - cache-push@2:
          title: Push Gradle cache
          is_skippable: true
          inputs:
            - paths: |
                $HOME/.gradle/caches
                $HOME/.gradle/wrapper

  # ------------------------------------------------------------------------
  # Auto-update open PRs when main or PRs change.
  # Was .github/workflows/auto-update-prs.yml.
  # ------------------------------------------------------------------------
  auto-update-prs:
    title: Auto-update open PRs
    summary: Updates open PRs that are behind main (gh pr update-branch)
    steps:
      - script@1:
          title: Install gh CLI if missing
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                if ! command -v gh >/dev/null 2>&1; then
                  echo "Installing GitHub CLI..."
                  curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null || true
                  (command -v apt-get >/dev/null 2>&1 && apt-get install -y gh >/dev/null 2>&1) || true
                fi
                gh --version

      - script@1:
          title: Update open PRs behind main
          envs:
            - GH_TOKEN: $PAT_TOKEN
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                REPO="${BITRISEIO_GIT_REPOSITORY_OWNER}/${BITRISEIO_GIT_REPOSITORY_SLUG}"

                if [ -n "$BITRISE_PULL_REQUEST" ] && [ "$BITRISE_PULL_REQUEST" != "null" ]; then
                  # pull_request event: update only the triggering PR.
                  echo "Updating triggering PR #$BITRISE_PULL_REQUEST..."
                  gh pr update-branch "$BITRISE_PULL_REQUEST" --repo "$REPO" \
                    || echo "PR #$BITRISE_PULL_REQUEST skipped (already up to date or conflict)"
                  exit 0
                fi

                # push to main / schedule / manual: update all open PRs behind main.
                # GitHub recomputes mergeability asynchronously after a push to main —
                # retry until no PRs are stuck in UNKNOWN (up to ~90s) so the MERGEABLE
                # filter doesn't miss them.
                for attempt in $(seq 1 6); do
                  unknown=$(gh pr list --repo "$REPO" --state open --base main \
                    --json number,mergeable \
                    --jq '[.[] | select(.mergeable == "UNKNOWN")] | length')
                  echo "Attempt $attempt: $unknown PR(s) still in UNKNOWN mergeability state"
                  [ "$unknown" -eq 0 ] && break
                  sleep 15
                done

                prs=$(gh pr list --repo "$REPO" --state open --base main \
                  --json number,mergeable,isDraft,mergeStateStatus \
                  --jq '.[]
                         | select(.isDraft == false)
                         | select(.mergeable == "MERGEABLE")
                         | select(.mergeStateStatus != "DIRTY")
                         | .number')

                if [ -z "$prs" ]; then
                  echo "No candidate PRs found."
                  exit 0
                fi

                for pr in $prs; do
                  echo "Attempting to update PR #$pr..."
                  gh pr update-branch "$pr" --repo "$REPO" \
                    || echo "PR #$pr skipped (already up to date or conflict)"
                done

  # ------------------------------------------------------------------------
  # Dependabot auto-merge (squash) for non-draft PRs targeting main.
  # Was .github/workflows/dependabot-auto-merge.yml.
  # ------------------------------------------------------------------------
  dependabot-auto-merge:
    title: Dependabot auto-merge
    summary: Enable auto-merge (squash) for non-draft dependabot PRs to main
    steps:
      - script@1:
          title: Install gh CLI if missing
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                if ! command -v gh >/dev/null 2>&1; then
                  (command -v apt-get >/dev/null 2>&1 && apt-get install -y gh >/dev/null 2>&1) || true
                fi
                gh --version

      - script@1:
          title: Enable auto-merge for Dependabot PR
          envs:
            - GH_TOKEN: $PAT_TOKEN
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                REPO="${BITRISEIO_GIT_REPOSITORY_OWNER}/${BITRISEIO_GIT_REPOSITORY_SLUG}"
                PR_NUMBER="$BITRISE_PULL_REQUEST"

                if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
                  echo "Not a pull request build; nothing to do."
                  exit 0
                fi

                # Guard: only dependabot[bot] PRs (trigger regex already matched the
                # dependabot/* branch; double-check the author for safety).
                author=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')
                if [ "$author" != "dependabot[bot]" ]; then
                  echo "PR #$PR_NUMBER author is '$author', not dependabot[bot]; skipping."
                  exit 0
                fi

                echo "Enabling auto-merge (squash) for Dependabot PR #$PR_NUMBER..."
                # PAT (not GITHUB_TOKEN) so the merge commit triggers further builds.
                gh pr merge --auto --squash "$PR_NUMBER" --repo "$REPO"

  # ------------------------------------------------------------------------
  # Deploy landing after a release-site-data squash-merge lands on main.
  # Was .github/workflows/deploy-landing-on-site-data-merge.yml. Bot merges
  # don't fire GitHub push triggers, so this re-triggers deploy-landing.yml.
  # ------------------------------------------------------------------------
  trigger-landing-deploy:
    title: Trigger landing page deploy
    summary: After a release site-data merge to main, re-run deploy-landing.yml
    steps:
      - script@1:
          title: Install gh CLI if missing
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                if ! command -v gh >/dev/null 2>&1; then
                  (command -v apt-get >/dev/null 2>&1 && apt-get install -y gh >/dev/null 2>&1) || true
                fi
                gh --version

      - script@1:
          title: Trigger landing page deploy
          envs:
            - GH_TOKEN: $GITHUB_TOKEN
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                REPO="${BITRISEIO_GIT_REPOSITORY_OWNER}/${BITRISEIO_GIT_REPOSITORY_SLUG}"
                echo "Triggering deploy-landing.yml on main in $REPO..."
                gh workflow run deploy-landing.yml --repo "$REPO" --ref main
