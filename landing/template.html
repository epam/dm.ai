  <!-- Applied before first paint so the chosen theme never flashes. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('dmtools-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? 'night' : 'snow');
      } catch (e) {
        document.documentElement.dataset.theme = 'snow';
      }
    })();
  </script>
