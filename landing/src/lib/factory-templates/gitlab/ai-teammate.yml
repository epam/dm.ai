include:
  - remote: https://raw.githubusercontent.com/IstiN/dmtools-agentic-workflows/1a3b5f373654def6871a91bf616e0280d00c42b7/gitlab/factory-teammate.yml

.ai-teammate-select-token:
  script:
    - |
      # .dmtools-use-dev-token already exported GITLAB_DEV_TOKEN as GITLAB_TOKEN for development/rework legs.
      # Review legs switch to GITLAB_REVIEWER_TOKEN so review notes, MR comments and labels come from the reviewer.
      # The leg is derived like .factory-teammate does: FACTORY_LEG, else agent:rework / agent:review labels.
      FACTORY_TEAMMATE_ROLE=dev
      if [ -n "${GITLAB_REVIEWER_TOKEN:-}" ] || [ "${DMTOOLS_GITLAB_TEAMMATES:-single}" = multiple ]; then
        role_leg="${FACTORY_LEG:-}"
        if [ -z "$role_leg" ] && [ -n "${GITLAB_TOKEN:-}" ]; then
          if [ -n "${FACTORY_MR:-}" ]; then role_endpoint="merge_requests/$FACTORY_MR"; else role_endpoint="issues/${FACTORY_ISSUE:-0}"; fi
          role_labels="$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/$role_endpoint" | jq -c '.labels // []' 2>/dev/null || echo '[]')"
          role_leg="$(jq -r 'if index("agent:rework") then (if index("status:In Rework") then "" else "rework" end)
            elif index("agent:review") then (if index("status:In Review") then "" else "review" end) else "dev" end' \
            <<< "$role_labels" 2>/dev/null || echo dev)"
        fi
        if [ "$role_leg" = review ]; then
          if [ -z "${GITLAB_REVIEWER_TOKEN:-}" ]; then
            echo "GITLAB_REVIEWER_TOKEN is required for review legs in multi-teammate mode" >&2
            exit 1
          fi
          export GITLAB_TOKEN="$GITLAB_REVIEWER_TOKEN"
          if [ -n "${GITLAB_REVIEWER_HANDLE:-}" ]; then export AGENT_HANDLE="$GITLAB_REVIEWER_HANDLE"; fi
          FACTORY_TEAMMATE_ROLE=reviewer
          token_user="$(curl --fail --silent --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$CI_API_V4_URL/user" 2>/dev/null \
            | jq -r '.username // empty' 2>/dev/null || true)"
          echo "Review leg: using GITLAB_REVIEWER_TOKEN as GITLAB_TOKEN (GitLab user: ${token_user:-unknown})"
        else
          echo "Development leg (${role_leg:-none}): keeping the development token"
        fi
      fi
      export FACTORY_TEAMMATE_ROLE

.ai-teammate-git-auth:
  script:
    - |
      # GitLab Runner clones with its own git template: .git/info may be missing, and
      # url.*.insteadOf / credential entries (often in a file pulled in via include.path)
      # route pushes through the read-only CI job token. Remove them from whichever file defines them.
      # Runner scripts use pipefail, so git config lookups that match nothing must not abort the job.
      mkdir -p "$(git rev-parse --git-dir)/info"
      job_token_entries="$(git config --show-origin --get-regexp \
        '^(url\..*\.(insteadof|pushinsteadof)|credential\..+\.username)$' 2>/dev/null || true)"
      while IFS=$'\t' read -r source entry; do
        [ -n "$entry" ] || continue
        key="${entry%% *}"; value="${entry#* }"
        case "$key" in
          url.*gitlab-ci-token*) section="url.${key#url.}"; section="${section%.*}" ;;
          credential.*) [ "$value" = gitlab-ci-token ] || continue; section="credential.${key#credential.}"; section="${section%.*}" ;;
          *) continue ;;
        esac
        file="${source#file:}"
        if git config --file "$file" --remove-section "$section" 2>/dev/null; then
          echo "Removed CI job-token git config from $file"
        else
          echo "Warning: unable to remove CI job-token git config from $source" >&2
        fi
      done <<< "$job_token_entries"
      if [ -n "${CI_PROJECT_URL:-}" ]; then git remote set-url origin "$CI_PROJECT_URL.git"; fi
      push_url="$(git remote get-url --push origin 2>/dev/null || true)"
      echo "Git push URL: $(printf '%s' "$push_url" | sed -E 's#://[^@/]*@#://***@#')"
      case "$push_url" in
        *://*@*) echo "Warning: the git push URL still embeds credentials, so pushes will not use GITLAB_TOKEN" >&2 ;;
      esac
      if [ -n "${GITLAB_TOKEN:-}" ]; then
        access="$(curl --silent --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID" 2>/dev/null \
          | jq -r '[.permissions.project_access.access_level // 0, .permissions.group_access.access_level // 0] | max' 2>/dev/null || true)"
        scopes="$(curl --silent --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$CI_API_V4_URL/personal_access_tokens/self" 2>/dev/null \
          | jq -r '(.scopes // []) | join(",")' 2>/dev/null || true)"
        case "$access" in ''|*[!0-9]*) access=0 ;; esac
        echo "GITLAB_TOKEN project access level: $access; scopes: ${scopes:-unknown}"
        if [ "$access" -lt 30 ]; then
          echo "Warning: GITLAB_TOKEN needs at least the Developer role (30) to push branches and open merge requests" >&2
        fi
        case ",$scopes," in
          *,api,*|*,write_repository,*|,,) ;;
          *) echo "Warning: GITLAB_TOKEN needs the api or write_repository scope to push branches" >&2 ;;
        esac
        if [ "${FACTORY_TEAMMATE_ROLE:-dev}" = reviewer ]; then
          echo "Review leg: skipping the git push access check"
        elif push_check="$(git -c credential.helper= \
          -c 'credential.helper=!f() { if [ "$1" = get ]; then echo username=oauth2; echo "password=$GITLAB_TOKEN"; fi; }; f' \
          push --dry-run origin "HEAD:refs/heads/dmtools-push-check-${CI_JOB_ID:-0}" 2>&1)"; then
          echo "Git push access check with GITLAB_TOKEN: OK"
        else
          echo "Warning: git push access check with GITLAB_TOKEN failed; the teammate will not be able to push its branch or open a merge request:" >&2
          printf '%s\n' "$push_check" | sed -E 's#://[^@/]*@#://***@#g' >&2
        fi
      fi

.ai-teammate-resolve-handle:
  script:
    - |
      if [ -n "${FACTORY_ISSUE:-}" ] && [ -z "${FACTORY_MR:-}" ] && [ -n "${GITLAB_TOKEN:-}" ] && \
        [ "${FACTORY_TEAMMATE_ROLE:-dev}" != reviewer ]; then
        handle="${AGENT_HANDLE:-}"
        if issue_json="$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$FACTORY_ISSUE")"; then
          echo "Issue #$FACTORY_ISSUE state: $(printf '%s' "$issue_json" | jq -r '.state')"
          echo "Issue #$FACTORY_ISSUE labels: $(printf '%s' "$issue_json" | jq -r '.labels | join(", ")')"
          echo "Issue #$FACTORY_ISSUE assignees: $(printf '%s' "$issue_json" | jq -r '[.assignees[]? | "\(.username) (\(.name))"] | join(", ")')"
          if [ -z "${FACTORY_LEG:-}" ] || [ "$FACTORY_LEG" = dev ] || [ "$FACTORY_LEG" = bug ] || [ "$FACTORY_LEG" = story ]; then
            if printf '%s' "$issue_json" | jq -e '(.labels | index("ai_developed")) and
              (.labels | any(. == "agent:review" or . == "agent:rework" or . == "status:In Development" or . == "ai_questions_asked" or . == "ai_pr_reviewed") | not)' >/dev/null; then
              if curl --fail --silent --show-error --request PUT --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                --data-urlencode "remove_labels=ai_developed" \
                "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues/$FACTORY_ISSUE" >/dev/null; then
                echo "Cleared stale ai_developed from issue #$FACTORY_ISSUE before a new dev leg"
              else
                echo "Warning: unable to clear stale ai_developed from issue #$FACTORY_ISSUE" >&2
              fi
            fi
          fi
          resolved="$(printf '%s' "$issue_json" | jq -r --arg handle "$handle" \
            'first(.assignees[]? | select(.username == $handle)) // first(.assignees[]? | select(.name == $handle)) | .username // empty')"
          if [ -z "$resolved" ]; then
            echo "Warning: no assignee of issue #$FACTORY_ISSUE matches AGENT_HANDLE=$handle by username or display name; the dev leg will not run" >&2
          elif [ "$resolved" != "$handle" ]; then
            echo "Resolved AGENT_HANDLE $handle to assignee username $resolved"
            export AGENT_HANDLE="$resolved"
          fi
        else
          echo "Warning: unable to read issue #$FACTORY_ISSUE to resolve AGENT_HANDLE" >&2
        fi
      fi

.ai-teammate-verify-mr:
  script:
    - |
      # Runs in the parent script's shell after a successful dev leg (api, update_labels, note, leg, number, anchor
      # come from .factory-teammate). The pack only logs push/MR failures, so require an open MR before review.
      if [[ "${leg:-}" == dev && "${agent_result:-1}" == 0 ]]; then
        issue_labels="$(api "issues/$number" | jq -c '.labels // []' 2>/dev/null || echo '[]')"
        if jq -e 'index("ai_questions_asked")' <<< "$issue_labels" >/dev/null 2>&1; then
          echo "Issue #$number is waiting for answers (ai_questions_asked); no merge request expected yet"
          exit 0
        fi
        related="$(api "issues/$number/related_merge_requests?per_page=100" || echo '[]')"
        mr_count="$(jq --argjson project "$CI_PROJECT_ID" \
          '[.[] | select(.state == "opened" and .project_id == $project)] | length' <<< "$related" 2>/dev/null || echo 0)"
        if [[ "$mr_count" == 0 ]]; then
          source_branch="$(jq -rn --arg branch "ai/$anchor" '$branch | @uri')"
          branch_mrs="$(api "merge_requests?state=opened&source_branch=$source_branch" || echo '[]')"
          branch_mr="$(jq -r '.[0].iid // empty' <<< "$branch_mrs" 2>/dev/null || true)"
          if [[ -n "$branch_mr" ]]; then
            description="$(jq -r '.[0].description // ""' <<< "$branch_mrs")"
            api "merge_requests/$branch_mr" --request PUT \
              --data-urlencode "description=Closes #$number"$'\n\n'"$description" >/dev/null
            echo "Linked merge request !$branch_mr to issue #$number"
            mr_count=1
          fi
        fi
        if [[ "$mr_count" == 0 ]]; then
          echo "Dev run finished without an open merge request for issue #$number; check the push and MR errors above" >&2
          update_labels needs-human 'agent:review'
          note 'AI Teammate dev run finished without an open merge request (branch push or MR creation failed). Fix the cause, remove needs-human, and re-queue.'
          exit 1
        fi
        # The pack cannot label GitLab issues (its tracker supports jira/ado/github only), so update labels here.
        if update_labels ai_developed 'agent:dev' || { sleep 5; update_labels ai_developed 'agent:dev'; }; then
          echo "Issue #$number has $mr_count open merge request(s); labeled ai_developed and removed agent:dev"
        else
          echo "Warning: issue #$number has $mr_count open merge request(s) but updating ai_developed/agent:dev labels failed" >&2
        fi
      fi

.ai-teammate-close-cycle:
  script:
    - |
      # Mirrors GitHub close-rework-cycle.sh / close-review-cycle.sh plus the PR-side review labels:
      # the parent only relabels its anchor, so the linked issue/MR counterpart keeps stale trigger labels.
      set +e
      state=.dmtools/factory-state.json
      if [ -f "$state" ]; then
        endpoint="$(jq -r '.endpoint // empty' "$state")"
        leg="$(jq -r '.leg // empty' "$state")"
        token="${GITLAB_DEV_TOKEN:-${GITLAB_TOKEN:-}}"
        if [ "$leg" = review ] && [ -n "${GITLAB_REVIEWER_TOKEN:-}" ]; then token="$GITLAB_REVIEWER_TOKEN"; fi
        base="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
        gl() { curl --silent --show-error --fail --max-time 30 --header "PRIVATE-TOKEN: $token" "$@"; }
        relabel() {
          [ -n "$2$3" ] || return 0
          if gl --request PUT --data-urlencode "add_labels=$2" --data-urlencode "remove_labels=$3" "$base/$1" >/dev/null; then
            echo "Labels on $1: added [${2}] removed [${3}]"
          else
            echo "Warning: unable to update labels on $1" >&2
          fi
        }
        issue=""; mr=""
        case "$endpoint" in
          issues/[1-9]*) issue="${endpoint#issues/}" ;;
          merge_requests/[1-9]*) mr="${endpoint#merge_requests/}" ;;
        esac
        if [ -z "$mr" ] && [ -f .dmtools/merge-request.json ]; then mr="$(jq -r '.iid // empty' .dmtools/merge-request.json)"; fi
        if [ -n "$token" ] && [ -n "$issue" ] && [ -z "$mr" ]; then
          mr="$(gl "$base/issues/$issue/related_merge_requests?per_page=100" | jq -r --argjson project "$CI_PROJECT_ID" --arg branch "ai/gl-$issue" \
            '[.[] | select(.state == "opened" and .project_id == $project)] as $open |
             (first($open[] | select(.source_branch == $branch)) // (if ($open | length) == 1 then $open[0] else null end)) | .iid // empty')"
        fi
        if [ -n "$token" ] && [ -n "$mr" ] && [ -z "$issue" ]; then
          issue="$(gl "$base/merge_requests/$mr" | jq -r \
            '((.description // "") | capture("(?i)\\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#(?<n>[0-9]+)").n) //
             ((.source_branch // "") | capture("^ai/gl-(?<n>[0-9]+)$").n) // empty' 2>/dev/null)"
        fi
        case "$leg" in
          rework) close_labels='agent:rework,status:In Rework' ;;
          review) close_labels='agent:review,status:In Review' ;;
          *) close_labels='' ;;
        esac
        if [ -z "$token" ]; then
          echo "Warning: no GitLab token available to close the $leg cycle on linked issue/MR" >&2
        elif [ -n "$close_labels" ]; then
          echo "Closing $leg cycle (job ${CI_JOB_STATUS:-unknown}) on issue #${issue:-none} and MR !${mr:-none}"
          [ -z "$issue" ] || relabel "issues/$issue" '' "$close_labels"
          [ -z "$mr" ] || relabel "merge_requests/$mr" '' "$close_labels"
          if [ "${CI_JOB_STATUS:-}" = success ] && [ "$leg" = rework ] && [ -n "$mr" ]; then
            relabel "merge_requests/$mr" '' 'ai_validated,ai_validating,validation_failed,ai_pr_reviewed,pr_approved'
          fi
          if [ "${CI_JOB_STATUS:-}" = success ] && [ "$leg" = review ]; then
            decision="$(jq -r '(.decision // .verdict // "") | ascii_upcase' outputs/pr_review.json 2>/dev/null)"
            [ -z "$mr" ] || relabel "merge_requests/$mr" ai_pr_reviewed ''
            case "$decision" in
              APPROVE|APPROVED)
                for target in ${issue:+issues/$issue} ${mr:+merge_requests/$mr}; do
                  rounds="$(gl "$base/$target" | jq -r '[.labels[]? | select(test("^rework-round[:-][0-9]+$"))] + ["needs-human"] | join(",")')"
                  relabel "$target" '' "$rounds"
                done
                ;;
            esac
          fi
        fi
      fi
      true

ai-teammate:
  extends: .factory-teammate
  before_script:
    - !reference [.dmtools-install-tools, script]
    - !reference [.dmtools-use-dev-token, script]
    - !reference [.ai-teammate-select-token, script]
    - !reference [.ai-teammate-git-auth, script]
    - !reference [.ai-teammate-resolve-handle, script]
  script:
    - !reference [.factory-teammate, script]
    - !reference [.ai-teammate-verify-mr, script]
  after_script:
    - !reference [.factory-teammate, after_script]
    - !reference [.ai-teammate-close-cycle, script]
  resource_group: teammate-$CI_PROJECT_ID-$FACTORY_ISSUE-$FACTORY_MR
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $DMTOOLS_AI_TEAMMATE_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web") && (($FACTORY_ISSUE != "" && $FACTORY_MR == "") || ($FACTORY_ISSUE == "" && $FACTORY_MR != ""))'
  variables:
    FACTORY_HOME_REF: "1a3b5f373654def6871a91bf616e0280d00c42b7"
    AGENT_HANDLE: "@@MACHINE_AUTHOR@@"
@@GITLAB_REVIEWER_HANDLE_VARIABLE@@

ai-teammate-auto:
  extends: .factory-teammate
  before_script:
    - !reference [.dmtools-install-tools, script]
    - !reference [.dmtools-use-dev-token, script]
    - !reference [.ai-teammate-select-token, script]
    - !reference [.ai-teammate-git-auth, script]
    - !reference [.ai-teammate-resolve-handle, script]
  script:
    - !reference [.factory-teammate, script]
    - !reference [.ai-teammate-verify-mr, script]
  after_script:
    - !reference [.factory-teammate, after_script]
    - !reference [.ai-teammate-close-cycle, script]
  resource_group: teammate-$CI_PROJECT_ID-$FACTORY_ISSUE-$FACTORY_MR
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "api" && $DMTOOLS_AI_TEAMMATE_SCAN == "true" && $FACTORY_ISSUE != "" && $FACTORY_MR == ""'
  variables:
    FACTORY_HOME_REF: "1a3b5f373654def6871a91bf616e0280d00c42b7"
    AGENT_HANDLE: "$DMTOOLS_AI_DEV_USERNAME"
@@GITLAB_REVIEWER_HANDLE_VARIABLE@@

ai-teammate-scan:
  resource_group: ai-teammate-scan-$CI_PROJECT_ID
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      set -euo pipefail
      : "${GITLAB_TOKEN:?Set a GitLab token with api access to list issues and create pipelines}"
      assignee="${DMTOOLS_AI_DEV_USERNAME:-ai-dev}"
      echo "Scanning open issues for agent:rework (any assignee) or agent:dev assigned to $assignee"
      page=1
      dispatched=0
      while :; do
        response="$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --get \
          --data-urlencode "state=opened" \
          --data-urlencode "per_page=100" \
          --data-urlencode "page=$page" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/issues")"
        count="$(printf '%s' "$response" | jq -er 'if type == "array" then length else error("Expected an issues array") end')"
        if [ "$count" -eq 0 ]; then
          break
        fi
        issue_assignees="$(printf '%s' "$response" | jq -r --arg assignee "$assignee" \
          '.[] | select(.state == "opened") |
           select((.labels // []) | any(. == "agent:skip" or . == "blocked" or . == "provider_quota" or . == "needs-human") | not) |
           [.assignees[]? | select(.username == $assignee or .name == $assignee)] as $matches |
           if (.labels // [] | index("agent:rework")) then
             select((.labels // []) | index("status:In Rework") | not) |
             [.iid, ($matches[0].username // $assignee)] | @tsv
           else
             select((.labels // []) | index("agent:dev")) |
             select((.labels // []) | any(. == "agent:review" or . == "status:In Development" or . == "status:In Review" or . == "status:In Rework" or . == "ai_questions_asked" or . == "ai_pr_reviewed") | not) |
             select($matches | length > 0) | [.iid, $matches[0].username] | @tsv
           end')"
        if [ -z "$issue_assignees" ]; then
          echo "No eligible queued issues found on page $page"
        else
          while IFS=$'\t' read -r issue_iid username; do
            [ -n "$issue_iid" ] || continue
            echo "Starting ai-teammate API pipeline for issue #$issue_iid"
            payload="$(jq -n --arg ref "$CI_DEFAULT_BRANCH" --arg issue "$issue_iid" --arg username "$username" \
              '{ref: $ref, variables: [
                {key: "FACTORY_ISSUE", value: $issue},
                {key: "FACTORY_MR", value: ""},
                {key: "FACTORY_HOME_REF", value: "1a3b5f373654def6871a91bf616e0280d00c42b7"},
                {key: "DMTOOLS_AI_TEAMMATE_SCAN", value: "true"},
                {key: "DMTOOLS_AI_DEV_USERNAME", value: $username}
              ]}')"
            curl --fail-with-body --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --header "Content-Type: application/json" \
              --request POST \
              --data "$payload" \
              "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipeline"
            dispatched=$((dispatched + 1))
          done <<< "$issue_assignees"
        fi
        if [ "$count" -lt 100 ]; then
          break
        fi
        page=$((page + 1))
      done
      echo "Dispatched $dispatched ai-teammate pipelines"
      # Validation labels, like GitHub's SM: ai_validating while head CI runs, ai_validated when it is green,
      # validation_failed when it fails; a moved head voids ai_validated until its own pipeline is green.
      # Red CI on a machine-authored MR arms agent:rework like GitHub's rework-on-validation-failed (arm_rework):
      # at most one arm per head SHA (MR note marker). If the head is still red and unchanged after that rework,
      # the arm is withheld and needs-human is added once, so an unfixable failure cannot loop.
      api_base="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      machine_author="${SM_MACHINE_AUTHOR:-}"
      armed=0
      arm_red_ci() {
        local mr_json="$1" mr_iid head issue notes target issue_json
        printf '%s' "$mr_json" | jq -e --arg machine "$machine_author" --arg assignee "$assignee" '
          .head_pipeline != null and .head_pipeline.sha == .sha and .head_pipeline.status == "failed" and
          ((.author.username // "") as $u | (.author.name // "") as $n |
            ($machine != "" and $u == $machine) or $u == $assignee or $n == $assignee) and
          ((.labels // []) | any(. == "agent:rework" or . == "status:In Rework" or . == "needs-human" or
            . == "blocked" or . == "agent:skip" or . == "provider_quota") | not)' >/dev/null || return 0
        mr_iid="$(printf '%s' "$mr_json" | jq -r .iid)"
        head="$(printf '%s' "$mr_json" | jq -r .sha)"
        issue="$(printf '%s' "$mr_json" | jq -r \
          '((.description // "") | capture("(?i)\\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#(?<n>[0-9]+)").n) //
           ((.source_branch // "") | capture("^ai/gl-(?<n>[0-9]+)$").n) // empty' 2>/dev/null || true)"
        if [ -n "$issue" ]; then
          if ! issue_json="$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$api_base/issues/$issue")"; then
            echo "Warning: unable to read issue #$issue linked to red MR !$mr_iid; rework not armed this tick" >&2
            return 0
          fi
          if printf '%s' "$issue_json" | jq -e '.state != "opened" or ((.labels // []) | any(. == "agent:rework" or
            . == "status:In Rework" or . == "needs-human" or . == "blocked" or . == "agent:skip" or . == "provider_quota"))' >/dev/null; then
            return 0
          fi
        fi
        # Fail closed: without the marker history the per-head bound cannot be enforced.
        if ! notes="$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --get \
          --data-urlencode "per_page=100" --data-urlencode "sort=desc" --data-urlencode "order_by=created_at" \
          "$api_base/merge_requests/$mr_iid/notes")"; then
          echo "Warning: unable to read notes of red MR !$mr_iid; rework not armed this tick" >&2
          return 0
        fi
        if printf '%s' "$notes" | jq -e --arg m "<!-- dmtools:red-ci-arm head=$head -->" 'any(.[]?; (.body // "") | contains($m))' >/dev/null; then
          if printf '%s' "$notes" | jq -e --arg m "<!-- dmtools:red-ci-withheld head=$head -->" 'any(.[]?; (.body // "") | contains($m))' >/dev/null; then
            return 0
          fi
          for target in ${issue:+issues/$issue} "merge_requests/$mr_iid"; do
            curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --request PUT \
              --data-urlencode "add_labels=needs-human" "$api_base/$target" >/dev/null \
              || echo "Warning: unable to add needs-human to $target" >&2
          done
          curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --request POST \
            --data-urlencode "body=🛑 Rework arm withheld on head $head: CI is still red after an automatic rework left the head unchanged. A human owns this MR; push a fix (a new head restarts validation) and remove needs-human. <!-- dmtools:red-ci-withheld head=$head -->" \
            "$api_base/merge_requests/$mr_iid/notes" >/dev/null || echo "Warning: unable to post escalation on MR !$mr_iid" >&2
          echo "MR !$mr_iid: CI still red on unchanged head ${head:0:8} after rework; escalated with needs-human"
          return 0
        fi
        target="merge_requests/$mr_iid"
        if [ -n "$issue" ]; then target="issues/$issue"; fi
        if ! curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --request PUT \
          --data-urlencode "add_labels=agent:rework" "$api_base/$target" >/dev/null; then
          echo "Warning: unable to arm agent:rework on $target for red MR !$mr_iid" >&2
          return 0
        fi
        curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --request POST \
          --data-urlencode "body=🔴 CI pipeline failed on head $head; armed agent:rework on ${target%%/*} ${target##*/} (once per head). <!-- dmtools:red-ci-arm head=$head -->" \
          "$api_base/merge_requests/$mr_iid/notes" >/dev/null || echo "Warning: unable to record the rework arm on MR !$mr_iid" >&2
        echo "MR !$mr_iid: CI failed on head ${head:0:8}; armed agent:rework on $target"
        armed=$((armed + 1))
      }
      mr_page=1
      synced=0
      while :; do
        if ! mrs="$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --get \
          --data-urlencode "state=opened" --data-urlencode "per_page=100" --data-urlencode "page=$mr_page" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests")"; then
          echo "Warning: unable to list open merge requests for validation labels" >&2
          break
        fi
        mr_count="$(printf '%s' "$mrs" | jq -r 'if type == "array" then length else 0 end')"
        [ "$mr_count" -gt 0 ] || break
        for mr_iid in $(printf '%s' "$mrs" | jq -r '.[] | select(.draft != true and .work_in_progress != true) | .iid'); do
          if ! mr_json="$(curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$mr_iid")"; then
            echo "Warning: unable to read MR !$mr_iid for validation labels" >&2
            continue
          fi
          changes="$(printf '%s' "$mr_json" | jq -r '
            (.labels // []) as $have |
            (if .head_pipeline != null and .head_pipeline.sha == .sha then .head_pipeline.status else "" end) as $status |
            (if $status == "success" then [["ai_validated"], ["ai_validating", "validation_failed"]]
             elif $status == "failed" then [["validation_failed"], ["ai_validated", "ai_validating"]]
             elif $status == "" or $status == "canceled" or $status == "skipped" or $status == "manual" then [[], ["ai_validated", "ai_validating"]]
             else [["ai_validating"], ["ai_validated", "validation_failed"]] end) as [$add, $remove] |
            [($add - $have | join(",")), ([$remove[] | select(. as $l | $have | index($l))] | join(","))] | join("|")')"
          IFS='|' read -r add remove <<< "$changes"
          if [ -n "$add$remove" ]; then
            if curl --fail --silent --show-error --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --request PUT \
              --data-urlencode "add_labels=$add" --data-urlencode "remove_labels=$remove" \
              "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$mr_iid" >/dev/null; then
              echo "MR !$mr_iid validation labels: added [$add] removed [$remove]"
              synced=$((synced + 1))
            else
              echo "Warning: unable to update validation labels on MR !$mr_iid" >&2
            fi
          fi
          arm_red_ci "$mr_json" || true
        done
        [ "$mr_count" -ge 100 ] || break
        mr_page=$((mr_page + 1))
      done
      echo "Updated validation labels on $synced merge request(s)"
      echo "Armed agent:rework for red CI on $armed merge request(s)"
